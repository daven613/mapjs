<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torah Map — Concept Explorer</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141a22; --panel2:#1b2531; --line:#28323f; --line2:#333f4e;
    --ink:#e8eef5; --dim:#93a2b4; --faint:#5d6b7b;
    --bechina:#5aa9ff; --eitza:#37d093; --equation:#f0b429; --path:#ff7ac2; --accent:#c9a4ff;
    --hebrew:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
  #app{display:grid;grid-template-columns:320px 1fr 400px;height:100vh}
  @media(max-width:1180px){#app{grid-template-columns:0 1fr 360px}}
  button{font-family:inherit}
  /* ---- left rail ---- */
  #rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:15px 16px 8px}
  .brand h1{font-size:15px;margin:0;letter-spacing:.02em}
  .brand p{margin:3px 0 0;font-size:11px;color:var(--dim)}
  .modes{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 6px}
  .modes button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:6px 9px;border-radius:7px;font-size:11.5px;cursor:pointer}
  .modes button:hover{color:var(--ink)}
  .modes button.on{background:var(--accent);border-color:var(--accent);color:#12131a;font-weight:600}
  .inputs{padding:6px 12px 8px;display:flex;flex-direction:column;gap:7px}
  .inputs input,.inputs textarea,.inputs select{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);padding:8px 10px;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
  .inputs textarea{resize:vertical;min-height:54px;line-height:1.4}
  .inputs input:focus,.inputs textarea:focus,.inputs select:focus{border-color:var(--accent)}
  .inputs input.picked{border-color:var(--eitza);background:#16241d}
  .inputs .go{background:var(--accent);color:#12131a;border:none;font-weight:600;cursor:pointer;padding:8px}
  .inputs label{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:-3px}
  .ac{position:relative}
  .acmenu{position:absolute;left:0;right:0;top:calc(100% + 2px);background:var(--panel2);border:1px solid var(--line2);
    border-radius:8px;z-index:20;max-height:230px;overflow:auto;display:none}
  .acmenu.show{display:block}
  .acitem{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .acitem:hover,.acitem.sel{background:var(--panel)}
  .acitem .he{font-family:var(--hebrew);font-size:14px;direction:rtl}
  .acitem .en{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .listwrap{overflow:auto;flex:1;padding:2px 8px 16px}
  .sec{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:12px 10px 5px;display:flex;justify-content:space-between}
  .item{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .item:hover{background:var(--panel2)}
  .item .he{font-family:var(--hebrew);font-size:15px;direction:rtl;flex:none;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .en{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .dg{margin-left:auto;font-size:10px;color:var(--faint);flex:none}
  .item .sc{margin-left:auto;font-size:10px;color:var(--eitza);flex:none}
  /* ---- stage ---- */
  #stage{position:relative;background:radial-gradient(1300px 900px at 50% 38%,#121a24 0%,#080b10 75%)}
  canvas{display:block;width:100%;height:100%}
  #legend{position:absolute;left:14px;bottom:12px;display:flex;gap:13px;font-size:11px;
    background:#0b0f14cc;border:1px solid var(--line);padding:7px 11px;border-radius:10px}
  #legend span{display:flex;align-items:center;gap:6px;color:var(--dim)}
  #legend i{width:11px;height:3px;border-radius:2px}
  #crumbs{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:62%}
  .crumb{background:#0b0f14cc;border:1px solid var(--line);padding:4px 9px;border-radius:20px;font-size:11px;cursor:pointer;color:var(--dim)}
  .crumb:hover{color:var(--ink);border-color:var(--accent)}
  #status{position:absolute;right:14px;top:12px;font-size:11px;color:var(--faint);text-align:right;max-width:40%}
  #tip{position:absolute;pointer-events:none;background:#0b0f14f2;border:1px solid var(--line2);
    padding:6px 9px;border-radius:8px;font-size:12px;max-width:300px;display:none;z-index:10}
  #tip .he{font-family:var(--hebrew);font-size:15px;direction:rtl}
  #tip .en{color:var(--dim);font-size:11.5px;margin-top:2px}
  /* ---- detail ---- */
  #detail{background:var(--panel);border-left:1px solid var(--line);overflow:auto}
  .dhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  .dhead .he{font-family:var(--hebrew);font-size:28px;direction:rtl;line-height:1.15}
  .dhead .id{font-size:10.5px;color:var(--faint);margin-top:6px;font-family:ui-monospace,monospace}
  .dhead .gloss{font-size:13.5px;color:var(--ink);margin-top:10px;line-height:1.5}
  .dhead .meta{font-size:11.5px;color:var(--dim);margin-top:9px}
  .refs{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
  .refs .r{font-size:10.5px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:2px 7px;border-radius:20px;cursor:pointer}
  .refs .r:hover{border-color:var(--accent);color:var(--ink)}
  .grp{padding:13px 18px 2px}
  .grp h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px;display:flex;align-items:center;gap:7px;color:var(--dim)}
  .grp h3 i{width:9px;height:9px;border-radius:50%}
  .conn{padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .conn:hover{border-color:var(--accent)}
  .conn .row{display:flex;gap:8px;align-items:baseline}
  .conn .he{font-family:var(--hebrew);font-size:16px;direction:rtl}
  .conn .en{font-size:12px;color:var(--dim);margin-top:2px}
  .conn .w{margin-left:auto;font-size:10px;color:var(--faint);flex:none}
  .conn .polh{font-size:9.5px;color:#ff5d5d;border:1px solid #ff5d5d55;border-radius:8px;padding:1px 6px;margin:0 6px;flex:none;align-self:center}
  .conn .proof{font-family:var(--hebrew);font-size:13px;direction:rtl;color:var(--dim);margin-top:6px;
    line-height:1.55;border-top:1px dashed var(--line);padding-top:6px;display:none}
  .conn.open .proof{display:block}
  .conn .rf{font-size:10px;color:var(--faint);margin-top:4px}
  .arrowlbl{font-size:10px;color:var(--faint)}
  .empty{color:var(--faint);font-size:12.5px;padding:8px 4px}
  .pathrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--hebrew);direction:rtl;font-size:15px;line-height:1.9}
  .pathrow .lnk{cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line2)}
  .pathrow .lnk:hover{color:var(--accent)}
  .pathrow .op{font-family:sans-serif;font-size:11px;color:var(--faint);direction:ltr}
</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <div class="brand"><h1>Torah Map</h1><p>Likutey Moharan — concept graph</p></div>
    <div class="modes" id="modes"></div>
    <div class="inputs" id="inputs"></div>
    <div class="listwrap" id="list"></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="crumbs"></div>
    <div id="status"></div>
    <div id="legend">
      <span><i style="background:var(--bechina)"></i>bechina · aspect</span>
      <span><i style="background:var(--eitza)"></i>eitza · advice</span>
      <span><i style="background:var(--equation)"></i>equation</span>
      <span><i style="background:#ff5d5d"></i>harms (dashed = via absence/פגם)</span>
    </div>
    <div id="tip"></div>
  </div>
  <div id="detail"></div>
</div>
<script>
const TYCOL={bechina:'#5aa9ff',eitza:'#37d093',equation:'#f0b429'};
let NODES=[],EDGES=[],TORAHS=[],byId={},adj={},idf={},tokx={};
let mode='explore',focus=null,hist=[],view={nodes:[],edges:[],path:null},sim={},anim=null,hover=null;
let savedProjection=null;   // {picks:[ids], res} — lets the user leave to explore a concept and come back
let traceData=null,traceSegIdx=null;   // loaded story-trace JSON (scripts/segment_project.py + story write-up)
let traceSlug=null;                     // slug when a trace loaded from ?trace= (null for #b= hash or file loads)
let lastMatchQ='',lastAB={a:null,b:null},lastTorah=null;   // remembered inputs, so the URL can carry them
let restoringURL=false,appliedHash=null;                   // guards while reproducing a view from the URL
function exploreConcept(id){ setMode('explore'); go(id); drawCrumbs(); }  // non-destructive: savedProjection survives
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');
const $=id=>document.getElementById(id);

// ---------- URL state: the whole flow lives in the URL ----------
// Readable query params for every mode (?mode=…&focus=…&picks=…&q=…&a=&b=&ref=&trace=&seg=),
// kept in sync via history.replaceState as you interact and parsed back on load so opening the URL
// reproduces the same view. A self-contained trace can also ride in the #b= hash (see below).
// `restoringURL` suppresses the sync while we reproduce a view, so restoring never rewrites the URL.
function currentURLParams(){
  const p={mode};
  if(mode==='explore'||mode==='aspects'||mode==='advice'||mode==='effects'){ if(focus)p.focus=focus; }
  else if(mode==='project'){ if(view&&view.picks&&view.picks.length)p.picks=view.picks.join(','); }
  else if(mode==='match'){ if(lastMatchQ)p.q=lastMatchQ; }
  else if(mode==='path'||mode==='common'){ if(lastAB.a)p.a=lastAB.a; if(lastAB.b)p.b=lastAB.b; }
  else if(mode==='torah'){ if(lastTorah)p.ref=lastTorah; }
  else if(mode==='trace'){ if(traceSlug)p.trace=traceSlug; if(traceSegIdx!=null)p.seg=traceSegIdx; }
  return p;
}
function buildURL(params){
  const qs=new URLSearchParams();
  Object.keys(params).forEach(k=>{const v=params[k];if(v!==undefined&&v!==null&&v!=='')qs.set(k,v);});
  return location.pathname+(qs.toString()?'?'+qs.toString():'')+location.hash;   // preserve #b= bundle
}
function syncURL(push){
  if(restoringURL)return;
  const url=buildURL(currentURLParams());
  if(url===location.pathname+location.search+location.hash)return;   // unchanged → no history churn
  try{ if(push)history.pushState(null,'',url); else history.replaceState(null,'',url); }catch(_){}
}
// ---- self-contained trace in the hash: #b=<base64url(deflate(bundle-json))> ----
function b64urlToBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const bin=atob(s);
  const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i); return b; }
async function inflateBundle(b64){                                   // 'deflate' = zlib (RFC 1950), matches Python zlib.compress
  const stream=new Blob([b64urlToBytes(b64)]).stream().pipeThrough(new DecompressionStream('deflate'));
  const buf=await new Response(stream).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}
function parseHashBundle(){ const m=/[#&]b=([^&]+)/.exec(location.hash||''); return m?m[1]:null; }
// minimal shape check before trusting an embedded bundle (full validation lives in scripts/make_trace.py)
function validTraceShape(b){ return !!(b&&typeof b==='object'&&b.input&&Array.isArray(b.sequence)&&Array.isArray(b.segments)&&b.segments.length); }
function defaultFocus(){ const s=NODES.filter(n=>n.kind!=='statement').sort((a,b)=>b.deg-a.deg)[0]; return s&&s.id; }

// Reproduce the view the current URL describes. Runs on first load and on back/forward (popstate).
async function applyURLState(){
  restoringURL=true;
  try{
    const q=new URLSearchParams(location.search);
    // 1) an embedded bundle in #b= is the trace source (decoded once per distinct hash)
    const hb=parseHashBundle();
    if(hb && (!traceData || location.hash!==appliedHash)){
      try{ const b=await inflateBundle(hb);
        if(validTraceShape(b)){ applyTrace(b); traceSlug=null; appliedHash=location.hash; }
        else setStatus('embedded trace (#b=) failed the minimal shape check'); }
      catch(e){ setStatus('could not decode embedded trace (#b=): '+e.message); }
    }
    // 2) ?trace=slug (file-based) if no embedded bundle already gave us the trace
    const slug=parseTraceSlug();
    if(!hb && slug && traceSlug!==slug){ setMode('trace');
      await loadTraceUrl('./traces/'+slug+'.json','no trace file at ./traces/'+slug+'.json');
      if(traceData)traceSlug=slug; }
    // 3) apply mode + its params
    const m=q.get('mode');
    if(m) applyModeFromParams(m,q);
    else if(traceData){ setMode('trace'); const seg=parseInt(q.get('seg'),10); if(!isNaN(seg))selectTraceSegment(seg); else showTraceOverview(); }
    else { setMode('explore'); const f=defaultFocus(); if(f)go(f); }
  } finally { restoringURL=false; }
}
function applyModeFromParams(m,q){
  const known=['explore','aspects','advice','effects','path','common','torah','match','project','trace'];
  if(!known.includes(m)){ setMode('explore'); const f=defaultFocus(); if(f)go(f); return; }
  setMode(m);
  if(m==='explore'||m==='aspects'||m==='advice'||m==='effects'){ const f=q.get('focus'); go(f&&byId[f]?f:defaultFocus()); }
  else if(m==='project'){ const picks=(q.get('picks')||'').split(',').map(s=>s.trim()).filter(x=>byId[x]); if(picks.length>=2){ fillStages(picks); runProjectFor(picks); } }
  else if(m==='match'){ const text=q.get('q')||''; if(text){ const mb=$('matchbox'); if(mb)mb.value=text; lastMatchQ=text; runMatch(); } }
  else if(m==='path'||m==='common'){ const a=q.get('a'),b=q.get('b'); if(a&&b&&byId[a]&&byId[b]){ setABInputs(a,b); lastAB={a,b}; (m==='path'?runPath:runCommon)(); } }
  else if(m==='torah'){ const ref=q.get('ref'); if(ref){ const sel=$('torahSel'); if(sel)sel.value=ref; runTorah(ref); } }
  else if(m==='trace'){ if(traceData){ const seg=parseInt(q.get('seg'),10); if(!isNaN(seg))selectTraceSegment(seg); else showTraceOverview(); } }
}
// repopulate a mode's inputs so the UI matches a restored view
function fillStages(picks){ stageN=Math.max(2,Math.min(6,picks.length)); renderStages();
  picks.forEach((id,i)=>{const el=$('ac_stg_'+i); if(el){el.value=byId[id]?(byId[id].he+' — '+((byId[id].gloss||'').slice(0,30))):id; el.dataset.id=id; el.classList.add('picked');}}); }
function setABInputs(a,b){ [['a',a],['b',b]].forEach(([f,id])=>{const el=$('ac_'+f); if(el){el.value=byId[id]?(byId[id].he+' — '+((byId[id].gloss||'').slice(0,30))):id; el.dataset.id=id; el.classList.add('picked');}}); }

// ---------- load + index ----------
fetch('./explorer_data.json').then(r=>r.json()).then(d=>{
  NODES=d.nodes; EDGES=d.edges; TORAHS=d.torahs||[];
  NODES.forEach(n=>{byId[n.id]=n; adj[n.id]={all:[],bechina:[],eitzaOut:[],eitzaIn:[]};});
  EDGES.forEach(e=>{
    if(!adj[e.s]||!adj[e.t])return;
    adj[e.s].all.push({o:e.t,ty:e.ty,dir:'out',e}); adj[e.t].all.push({o:e.s,ty:e.ty,dir:'in',e});
    if(e.ty==='bechina'){adj[e.s].bechina.push(e.t);adj[e.t].bechina.push(e.s);}
    else if(e.ty==='eitza'){adj[e.s].eitzaOut.push(e.t);adj[e.t].eitzaIn.push(e.s);}
  });
  buildTokenIndex();
  buildModes();
  applyURLState();                                 // reproduce whatever the URL describes (params and/or #b= bundle)
  addEventListener('popstate',()=>applyURLState()); // back/forward reproduces the view
});
function tokens(s){return (s||'').toLowerCase().match(/[a-z]{3,}|[א-ת]{2,}/g)||[];}
let ctxx={},conceptsIn={};
function buildTokenIndex(){
  const df={},proofBy={};
  EDGES.forEach(e=>{ if(e.p){(proofBy[e.s]=proofBy[e.s]||[]).push(e.p);(proofBy[e.t]=proofBy[e.t]||[]).push(e.p);} });
  NODES.forEach(n=>{
    const st=new Set(tokens(n.gloss).concat(tokens(n.he)));
    const ct=new Set(); (proofBy[n.id]||[]).forEach(p=>tokens(p).forEach(w=>{if(!st.has(w))ct.add(w);}));
    tokx[n.id]=st; ctxx[n.id]=ct;
    st.forEach(w=>df[w]=(df[w]||0)+1); ct.forEach(w=>df[w]=(df[w]||0)+1);
    (n.refs||[]).forEach(r=>{(conceptsIn[r]=conceptsIn[r]||[]).push(n.id);});
  });
  const N=NODES.length;
  Object.keys(df).forEach(w=>idf[w]=Math.log(N/(df[w])));
}
// parallel-match score of a query token-count against one concept (own gloss full, proof partial,
// gentle prior against mega-hubs). Mirrors scripts/project_test.py (validated).
function scoreOne(q,cid){
  const st=tokx[cid]||new Set(),ct=ctxx[cid]||new Set();let s=0;
  for(const w in q){const wt=(idf[w]||0.5)*(1+Math.log(q[w]));
    if(st.has(w))s+=wt; else if(ct.has(w))s+=0.35*wt;}
  return s/(1+Math.log(1+(byId[cid]?byId[cid].deg:0))*0.15);
}
function matchList(text,topn,pool){
  const qt=tokens(text);if(!qt.length)return[];const q={};qt.forEach(w=>q[w]=(q[w]||0)+1);
  const ids=pool||NODES.filter(n=>n.kind!=='statement').map(n=>n.id);
  return ids.map(cid=>[cid,scoreOne(q,cid)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,topn);
}

// ---------- modes ----------
const MODES=[
  ['explore','Explore','all connections of a concept'],
  ['aspects','Aspects','bechina — deeper aspects'],
  ['advice','Advice','eitza — what leads TO it'],
  ['effects','Effects','eitza — what it leads to'],
  ['path','Path','cause-effect chain between two'],
  ['common','Common','shared ground of two concepts'],
  ['torah','By Torah','everything from one teaching'],
  ['match','Match text','paste text → closest concepts'],
  ['project','Project chain','map a causal narrative into a Torah'],
  ['trace','Story trace','load a CLI-generated trace: sequence → segments → narrative'],
];
function buildModes(){
  $('modes').innerHTML='';
  MODES.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.m=k;
    b.title=MODES.find(m=>m[0]===k)[2]; b.onclick=()=>setMode(k); $('modes').appendChild(b);});
}
function setMode(m){
  mode=m;[...$('modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  renderInputs();
  syncURL(true);   // a mode change is a new history entry; the dispatch below fills in params via replace
  if(m==='explore'||m==='aspects'||m==='advice'||m==='effects'){ if(focus)go(focus); }
  else if(m==='torah'){ runTorah($('torahSel').value); }
  else if(m==='trace'){ renderTraceList(); }
  else { $('list').innerHTML=''; }
}
let stageN=3;
function renderStages(){
  const box=$('stages');box.innerHTML='';
  for(let i=0;i<stageN;i++){
    const wrap=document.createElement('div');wrap.style.marginBottom='6px';
    wrap.innerHTML=`<div class="ac"><input id="ac_stg_${i}" autocomplete="off" placeholder="concept ${i+1} — pick from the list"><div class="acmenu" id="acm_stg_${i}"></div></div>`;
    box.appendChild(wrap); wireAc('stg_'+i);
  }
}
function renderInputs(){
  const I=$('inputs');
  if(mode==='path'||mode==='common'){
    I.innerHTML=`<label>${mode==='path'?'From concept':'Concept A'}</label>${acField('a')}
      <label>${mode==='path'?'To concept':'Concept B'}</label>${acField('b')}
      <button class="go" id="run2">${mode==='path'?'Trace path':'Find common ground'}</button>`;
    wireAc('a'); wireAc('b');
    $('run2').onclick=()=>{ mode==='path'?runPath():runCommon(); };
  } else if(mode==='torah'){
    I.innerHTML=`<label>Teaching (Likutey Moharan)</label>
      <select id="torahSel">${TORAHS.map(t=>`<option value="${t}">LM ${t.replace(':',' · ')}</option>`).join('')}</select>`;
    $('torahSel').onchange=e=>runTorah(e.target.value);
  } else if(mode==='match'){
    I.innerHTML=`<label>Paste any text — Hebrew or English</label>
      <textarea id="matchbox" placeholder="e.g. joy heals the broken heart and draws down abundance…"></textarea>
      <button class="go" id="runm">Find closest concepts</button>`;
    $('runm').onclick=runMatch;
    $('matchbox').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))runMatch();});
  } else if(mode==='project'){
    I.innerHTML=`<label>Pick concepts in causal order — X → Y → Z</label><div id="stages"></div>
      <div style="display:flex;gap:6px"><button id="addStg" style="flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px;cursor:pointer">+ concept</button>
      <button id="delStg" style="flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px;cursor:pointer">– concept</button></div>
      <button class="go" id="runp">Project into the map</button>`;
    // if a projection is already in progress, repopulate the pickers so leaving & returning never loses it

// cheapest a->b path with >=1 forward causal (eitza) hop; strict=home keeps it in-chapter.
// returns [cost, nodes, hops] where each hop = {from,to,e,kind,hc}
function causalPath(a,b,home,strict){
  if(a===b)return[0,[a],[]];
  const key=(id,c)=>id+'|'+c; const dist={},prev={},h=[[0,a,0]]; dist[key(a,0)]=0; let guard=0;
  while(h.length&&guard++<40000){
    let mi=0;for(let i=1;i<h.length;i++)if(h[i][0]<h[mi][0])mi=i;
    const [c,node,caused]=h.splice(mi,1)[0];
    if(c>(dist[key(node,caused)]??1e9))continue;
    if(node===b&&caused){
      const hops=[];let k=key(node,caused);
      while(prev[k]){const p=prev[k];hops.unshift({from:p.from,to:p.node,e:p.e,kind:p.kind,hc:p.hc});k=key(p.from,p.fc);}

      if(x.dir!=='out'&&x.ty==='eitza')return;                 // eitza only forward (cause->effect)
      if(strict&&!(x.e.ref||[]).includes(strict))return;
      const kind=x.ty==='eitza'?'cause':'reframe';
      const nc=caused||kind==='cause'?1:0;
      const hc=hopCost(x.e,home)+(kind==='reframe'?0.15:0);
      const nk=key(x.o,nc);

// the parallel/mapping path: how a source concept X reaches its anchor A through aspect (bechina) edges.
// undirected (aspects are mutual); in-home hops are near-free. returns [{from,to,e}] or null if unreachable.
function aspectPath(a,b,home){
  if(a===b)return[];
  const dist={},prev={},h=[[0,a]];dist[a]=0;let guard=0;
  while(h.length&&guard++<30000){
    let mi=0;for(let i=1;i<h.length;i++)if(h[i][0]<h[mi][0])mi=i;
    const [c,node]=h.splice(mi,1)[0];
    if(c>(dist[node]??1e9))continue;
    if(node===b){const hops=[];let k=b;while(prev[k]){hops.unshift(prev[k]);k=prev[k].from;}return hops;}
    (adj[node]?.all||[]).forEach(x=>{
      if(x.ty!=='bechina')return;                                // aspect links only
      const w=(x.e.ref||[]).includes(home)?0.12:1.2;             // in-home cheap, else weighty
      const nc=c+w; if(nc<(dist[x.o]??1e9)){dist[x.o]=nc;prev[x.o]={from:node,to:x.o,e:x.e};h.push([nc,x.o]);}

// when no aspect-edge path exists, expose WHY two concepts were matched: their shared meaning-terms
function sharedTerms(x,a,topn){

// concept-to-concept parallel: A parallels X if A==X, or a bechina-aspect of X, or gloss-akin
function glossSim(x,a){const q={};tokens((byId[x].gloss||'')+' '+(byId[x].he||'')).forEach(w=>q[w]=(q[w]||0)+1);return scoreOne(q,a);}

function project(conceptIds){

    Object.keys(dists[idx]).forEach(a=>{if(dists[idx][a]<=6)(byId[a].refs||[]).forEach(r=>seen.add(r));});

// synthesize a graph-edge shape from a stored hop so the shared renderer can draw it.

function synthHopEdge(h,defTy){

  }
  if(cost[b]===undefined){setStatus('no path found between them');drawTwoDetail(a,b,null);syncURL(false);return;}
  const chain=[],edges=[]; let cur=b;
  while(cur!==a){const p=prev[cur];chain.unshift(cur);edges.unshift(p.e);cur=p.from;} chain.unshift(a);
  view={path:chain,edges,nodes:chain,center:null};
  layoutPath(chain,edges); drawPathDetail(chain,edges); drawCrumbs();
  setStatus(`path found — ${chain.length-1} steps`);
  syncURL(false);
}
function runCommon(){
  const a=idOf('a'),b=idOf('b');
  if(!a||!b){setStatus('pick both concepts');return;}
  lastAB={a,b};
  const na=new Set((adj[a]?.all||[]).map(x=>x.o)), nb=new Set((adj[b]?.all||[]).map(x=>x.o));
  const common=[...na].filter(x=>nb.has(x));
  const nodes=[a,b,...common], es=[];
  EDGES.forEach(e=>{ const inA=(e.s===a||e.t===a),inB=(e.s===b||e.t===b);
    if((inA&&common.includes(e.s===a?e.t:e.s))||(inB&&common.includes(e.s===b?e.t:e.s)))es.push(e);});
  view={edges:es,nodes,path:null,center:null,twoFoci:[a,b]};
  layoutForce(nodes,es,[a,b]); drawCommonDetail(a,b,common); drawCrumbs();
  setStatus(common.length?`${common.length} shared concept(s)`:'no direct common ground');
  syncURL(false);
}

// ---------- list rendering ----------
function listResults(items,label,badges){
  const L=$('list'); L.innerHTML=`<div class="sec"><span>${label}</span><span>${items.length}</span></div>`;
  items.forEach((n,i)=>{const el=document.createElement('div');el.className='item';
    const badge=badges?`<span class="sc">${badges[i]}</span>`:`<span class="dg">${n.deg}</span>`;
    el.innerHTML=`<span class="he">${n.he||''}</span><span class="en">${n.gloss||''}</span>${badge}`;
    el.onclick=()=>go(n.id); L.appendChild(el);});
}

// ---------- layouts ----------
function stageWH(){const s=$('stage');return[s.clientWidth,s.clientHeight];}
function resize(){const[W,H]=stageWH();cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',()=>{resize();redraw();});
function nodeR(n){return n.id===view.center?15:6+Math.min(9,Math.sqrt((byId[n.id]?byId[n.id].deg:1))*1.3);}
function layoutEgo(center,nb){
  resize();const[W,H]=stageWH(),cx=W/2,cy=H/2,R=Math.min(W,H)*0.37;
  sim={};sim[center]={x:cx,y:cy,id:center,fixed:true};
  nb.forEach((x,i)=>{const a=(i/nb.length)*Math.PI*2-Math.PI/2;
    sim[x.o]={x:cx+Math.cos(a)*R*(0.7+0.55*Math.random()),y:cy+Math.sin(a)*R*(0.7+0.55*Math.random()),id:x.o};});
  relax(60,view.edges);
}
function layoutForce(nodes,edges,foci){
  resize();const[W,H]=stageWH();sim={};
  nodes.slice(0,80).forEach((id,i)=>{const a=(i/Math.min(nodes.length,80))*Math.PI*2;
    sim[id]={x:W/2+Math.cos(a)*Math.min(W,H)*0.34*(0.6+Math.random()*0.6),
             y:H/2+Math.sin(a)*Math.min(W,H)*0.34*(0.6+Math.random()*0.6),id};});
  if(foci){foci.forEach((f,i)=>{if(sim[f]){sim[f].x=W*(i?0.68:0.32);sim[f].y=H/2;sim[f].fixed=true;}});}
  relax(120,edges);
}
function layoutPath(chain,edges){
  resize();const[W,H]=stageWH();sim={};const n=chain.length,padX=W*0.12,gap=(W-2*padX)/Math.max(1,n-1);
  chain.forEach((id,i)=>{sim[id]={x:padX+gap*i,y:H/2+(i%2?38:-38)*Math.sin(i),id,fixed:true};});
  relax(0,edges);
}
function relax(iters,edges){
  cancelAnimationFrame(anim);let it=0;
  (function step(){
    const ks=Object.keys(sim);
    if(edges){edges.forEach(e=>{const A=sim[e.s],B=sim[e.t];if(!A||!B)return;
      let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,f=(d-150)/d*0.02;
      if(!A.fixed){A.x+=dx*f;A.y+=dy*f;}if(!B.fixed){B.x-=dx*f;B.y-=dy*f;}});}
    for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const A=sim[ks[i]],B=sim[ks[j]];
      let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1;if(d<95){const f=(95-d)/d*0.5;
        if(!B.fixed){B.x+=dx*f;B.y+=dy*f;}if(!A.fixed){A.x-=dx*f;A.y-=dy*f;}}}
    redraw();
    if(it++<iters)anim=requestAnimationFrame(step);
  })();
}

// ---------- render ----------
function redraw(){
  const[W,H]=stageWH();ctx.clearRect(0,0,W,H);
  const pathSet=view.path?new Set(view.path):null;
  const pathEdge=new Set((view.path?view.edges:[]).map(e=>e.s+'|'+e.t+'|'+e.ty));
  (view.edges||[]).forEach(e=>{const A=sim[e.s],B=sim[e.t];if(!A||!B)return;
    const onPath=pathEdge.has(e.s+'|'+e.t+'|'+e.ty);
    ctx.strokeStyle=onPath?'#ff7ac2':(e.pol==='harms'?'#ff5d5d':(TYCOL[e.ty]||'#667'));
    ctx.globalAlpha=hover&&hover!==e.s&&hover!==e.t?0.12:(onPath?0.95:0.5);
    ctx.lineWidth=onPath?3.5:Math.min(5,1+Math.log2(e.w+1));
    if(e.via==='absence')ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
    ctx.setLineDash([]);
    if(e.ty==='eitza'){drawArrow(A,B,onPath);}
    // hop price label (projection mode)
    if(view.hopCostOf){const hc=view.hopCostOf[e.s+'>'+e.t]??view.hopCostOf[e.t+'>'+e.s];
      if(hc!==undefined){ctx.globalAlpha=1;ctx.fillStyle='#0b0f14';const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
        ctx.font='10px sans-serif';const t=hc.toFixed(2);const w=ctx.measureText(t).width+6;
        ctx.fillRect(mx-w/2,my-7,w,14);ctx.fillStyle=hc<0.5?'#37d093':'#f0b429';ctx.textAlign='center';ctx.fillText(t,mx,my+3);}}
  });
  ctx.globalAlpha=1;
  // projection mapping: dashed path from every top pick node down to its anchor, through aspect waypoints
  if(view.mapPaths){view.mapPaths.forEach(mp=>{const seq=mp.seq;const info=view.mapInfo[mp.topId]||{};
    const dim=hover&&!seq.includes(hover);
    ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle=info.kind==='shared'?'#7d8796':'#8a7bd8';
    ctx.globalAlpha=dim?0.13:0.85;ctx.lineWidth=2;
    let P=sim[seq[0]];ctx.beginPath();if(P)ctx.moveTo(P.x,P.y);
    for(let k=1;k<seq.length;k++){const Q=sim[seq[k]];if(Q&&P)ctx.lineTo(Q.x,Q.y);P=Q||P;}
    ctx.stroke();ctx.restore();ctx.globalAlpha=1;
    const A=sim[seq[0]],B=sim[seq[seq.length-1]];if(!A||!B)return;
    const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
    const t=info.kind==='self'?'appears here':info.kind==='shared'?('shared meaning · '+(info.pcost||0).toFixed(2))
            :(info.nhops+' aspect'+(info.nhops>1?'s':'')+' · '+(info.pcost||0).toFixed(2));
    ctx.font='10px sans-serif';const w=ctx.measureText(t).width+8;
    ctx.fillStyle='#0b0f14';ctx.fillRect(mx-w/2,my-7,w,14);
    ctx.fillStyle=info.kind==='shared'?'#aab3c0':'#b9a8ff';ctx.textAlign='center';ctx.fillText(t,mx,my+3);});}
  ctx.globalAlpha=1;
  const anchors=view.anchors,aidx=view.anchorIdx||{},mapNodes=view.mapNodes,realOf=view.realOf||{},topIdx={};
  (view.topNodes||[]).forEach(t=>topIdx[t.id]=t.idx);
  Object.values(sim).forEach(s=>{const realId=realOf[s.id]||s.id;const n=byId[realId]||{};
    const isC=s.id===view.center,isTop=topIdx[s.id]!==undefined,isAnchor=anchors&&anchors.has(s.id),
      isMap=mapNodes&&mapNodes.has(s.id);
    const isBridge=view.mapPaths&&!isTop&&!isAnchor&&!isMap&&!isC;   // causal waypoint on the spine
    const onP=pathSet&&pathSet.has(s.id),isFoci=view.twoFoci&&view.twoFoci.includes(s.id);
    const big=isC||isFoci||isAnchor||isTop,r=big?14:(isBridge?10:isMap?9:nodeR({id:s.id}));
    ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);
    ctx.fillStyle=isTop?'#37b3a4':isC?'#c9a4ff':isAnchor?'#c9a4ff':isBridge?'#ff7ac2':isMap?'#8a7bd8':onP?'#ff7ac2':isFoci?'#c9a4ff':(n.kind==='statement'?'#3a4553':'#2f6fb3');
    ctx.fill();
    if(big||hover===s.id){ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();}
    const badge=isTop?topIdx[s.id]:(isAnchor?aidx[s.id]:null);
    if(badge){ctx.fillStyle=isTop?'#04201d':'#12131a';ctx.font='700 12px sans-serif';ctx.textAlign='center';ctx.fillText(badge,s.x,s.y+4);}
    ctx.fillStyle=big?'#fff':(onP?'#ffc7e6':'#c8d3df');ctx.textAlign='center';
    ctx.font=(isC?'600 18':big?'600 14':'13')+'px "Frank Ruhl Libre",serif';
    ctx.fillText((n.he||'').slice(0,16)+(isTop?' (your pick)':''),s.x,s.y-r-6);
  });
}
function drawArrow(A,B,hot){const ang=Math.atan2(B.y-A.y,B.x-A.x),r=(byId[B.id]?12:8),
  ex=B.x-Math.cos(ang)*(r+3),ey=B.y-Math.sin(ang)*(r+3),s=hot?9:6;
  ctx.fillStyle=hot?'#ff7ac2':'#37d093';ctx.globalAlpha=hot?0.95:0.6;ctx.beginPath();
  ctx.moveTo(ex,ey);ctx.lineTo(ex-Math.cos(ang-0.4)*s,ey-Math.sin(ang-0.4)*s);
  ctx.lineTo(ex-Math.cos(ang+0.4)*s,ey-Math.sin(ang+0.4)*s);ctx.closePath();ctx.fill();ctx.globalAlpha=1;}

// ---------- interaction ----------
cv.addEventListener('mousemove',ev=>{const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  let hit=null;Object.values(sim).forEach(s=>{if(Math.hypot(s.x-mx,s.y-my)<nodeR({id:s.id})+5)hit=s;});
  hover=hit?hit.id:null;
  if(hit){const rid=(view.realOf&&view.realOf[hit.id])||hit.id;const n=byId[rid]||{};tip.style.display='block';tip.style.left=Math.min(mx+14,r.width-310)+'px';
    tip.style.top=(my+14)+'px';tip.innerHTML=`<div class="he">${n.he||''}</div><div class="en">${n.gloss||'—'}</div>`;}
  else tip.style.display='none';
  cv.style.cursor=hit?'pointer':'default';redraw();});
cv.addEventListener('click',ev=>{const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  let hit=null;Object.values(sim).forEach(s=>{if(Math.hypot(s.x-mx,s.y-my)<nodeR({id:s.id})+5)hit=s;});
  if(hit){const rid=(view.realOf&&view.realOf[hit.id])||hit.id;
           if(mode==='project'||mode==='trace')exploreConcept(rid);
           else if(['explore','aspects','advice','effects'].includes(mode))go(rid);
           else drawDetail(rid); }});
function drawCrumbs(){const c=$('crumbs');c.innerHTML='';
  // a standing return-ticket to the last projection, so exploring a concept never strands the user
  if(savedProjection&&mode!=='project'&&mode!=='trace'){const b=document.createElement('div');b.className='crumb';
    b.style.color='#12131a';b.style.background='var(--accent)';b.style.borderColor='var(--accent)';b.style.fontWeight='600';
    b.textContent=savedProjection.fromTrace?'↩ back to story trace':'↩ back to projection';
    b.onclick=()=>{if(savedProjection.fromTrace){setMode('trace');selectTraceSegment(savedProjection.fromTrace.segIdx);}
      else{setMode('project');runProject();}};c.appendChild(b);}
  hist.slice(-6).forEach(h=>{const b=document.createElement('div');b.className='crumb';b.textContent=byId[h].he||h;
    b.onclick=()=>{focus=h;hist=hist.slice(0,hist.indexOf(h));if(['explore','aspects','advice','effects'].includes(mode))go(h);else drawDetail(h);};c.appendChild(b);});
  if(focus){const b=document.createElement('div');b.className='crumb';b.style.color='var(--ink)';b.style.borderColor='var(--accent)';b.textContent=byId[focus].he||focus;c.appendChild(b);}}
function setStatus(t){$('status').textContent=t;}

// ---------- detail panels ----------
function refChips(refs){return refs&&refs.length?`<div class="refs">${refs.slice(0,20).map(r=>`<span class="r" data-t="${r}">LM ${r.replace(':','·')}</span>`).join('')}</div>`:'';}
function wireRefs(D){D.querySelectorAll('.refs .r').forEach(el=>el.onclick=()=>{setMode('torah');$('torahSel').value=el.dataset.t;runTorah(el.dataset.t);});}
function head(n){return `<div class="dhead"><div class="he">${n.he||''}</div>
   <div class="id">${n.id}${n.kind==='statement'?' · statement':''}</div>
   <div class="gloss">${n.gloss||'<span style="color:var(--faint)">no gloss</span>'}</div>
   <div class="meta">${n.deg} connection${n.deg!==1?'s':''}${n.refs&&n.refs.length?` · ${n.refs.length} source${n.refs.length!==1?'s':''}`:''}</div>
   ${refChips(n.refs)}</div>`;}
function drawDetail(id){
  const n=byId[id],D=$('detail');
  const g={bechina:{out:[],in:[]},eitza:{out:[],in:[]},equation:{out:[],in:[]}};
  (adj[id]?.all||[]).forEach(a=>{(g[a.ty]||g.bechina)[a.dir].push(a);});
  let html=head(n);
  [['eitza','Advice — eitza','var(--eitza)'],['bechina','Aspect — bechina','var(--bechina)'],['equation','Equation','var(--equation)']]
   .forEach(([ty,label,col])=>{const outs=g[ty].out,ins=g[ty].in;if(!outs.length&&!ins.length)return;
    html+=`<div class="grp"><h3><i style="background:${col}"></i>${label} · ${outs.length+ins.length}</h3>`;
    const rows=(arr,dir)=>arr.map(a=>{const o=byId[a.o]||{};
      const harms=a.e.pol==='harms',lack=a.e.via==='absence';
      const verb=ty==='eitza'?(harms?(lack?(dir==='out'?'its lack brings →':'← comes from lack of')
                                          :(dir==='out'?'brings (harm) →':'← harmed by'))
                                    :(dir==='out'?'leads to →':'← comes from'))
                             :(dir==='out'?'aspect of →':'← has aspect');
      const badge=harms?`<span class="polh">${lack?'harms · פגם':'harms'}</span>`:'';
      return `<div class="conn" data-go="${o.id}"><div class="row"><span class="he">${o.he||''}</span>${badge}<span class="w">×${a.e.w}</span></div>
        <div class="en"><span class="arrowlbl">${verb}</span> ${o.gloss||''}</div>
        ${a.e.ref&&a.e.ref.length?`<div class="rf">LM ${a.e.ref.slice(0,4).map(r=>r.replace(':','·')).join(', ')}</div>`:''}
        ${a.e.p?`<div class="proof">${a.e.p}…</div>`:''}</div>`;}).join('');
    html+=rows(outs,'out')+rows(ins,'in')+`</div>`;});
  if(!(adj[id]?.all||[]).length)html+=`<div class="grp"><div class="empty">No edges recorded yet.</div></div>`;
  D.innerHTML=html;D.scrollTop=0;wireRefs(D);
  D.querySelectorAll('.conn').forEach(c=>{c.onclick=ev=>{if(ev.target.classList.contains('he')){go(c.dataset.go);return;}c.classList.toggle('open');};
    c.ondblclick=()=>go(c.dataset.go);});
}
function drawPathDetail(chain,edges){
  const D=$('detail');let html=`<div class="dhead"><div class="he" style="font-size:20px">${byId[chain[0]].he} → ${byId[chain[chain.length-1]].he}</div>
    <div class="meta">${chain.length-1}-step chain · strongest-link path</div></div><div class="grp"><h3>The chain</h3><div class="pathrow">`;
  chain.forEach((id,i)=>{html+=`<span class="lnk" data-go="${id}">${byId[id].he}</span>`;
    if(i<edges.length){const e=edges[i];html+=`<span class="op">—${e.ty==='eitza'?'leads to':'aspect'}→</span>`;}});
  html+='</div></div>';
  edges.forEach((e,i)=>{html+=`<div class="grp"><h3><i style="background:${TYCOL[e.ty]}"></i>${byId[chain[i]].he} → ${byId[chain[i+1]].he}</h3>
    <div class="conn open"><div class="en">${byId[chain[i]].gloss||''}</div>
    ${e.ref&&e.ref.length?`<div class="rf">LM ${e.ref.slice(0,4).map(r=>r.replace(':','·')).join(', ')}</div>`:''}
    ${e.p?`<div class="proof">${e.p}…</div>`:''}</div></div>`;});
  D.innerHTML=html;D.scrollTop=0;
  D.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{setMode('explore');go(el.dataset.go);});
}
function drawCommonDetail(a,b,common){
  const D=$('detail');let html=`<div class="dhead"><div class="he" style="font-size:20px">${byId[a].he} ∩ ${byId[b].he}</div>
    <div class="meta">${common.length} shared concept${common.length!==1?'s':''}</div></div>`;
  html+=`<div class="grp"><h3>Common ground</h3>`;
  if(!common.length)html+=`<div class="empty">No directly shared concepts. Try Path to find an indirect chain.</div>`;
  common.map(id=>byId[id]).sort((x,y)=>y.deg-x.deg).forEach(o=>{html+=`<div class="conn" data-go="${o.id}">
    <div class="row"><span class="he">${o.he||''}</span><span class="w">deg ${o.deg}</span></div><div class="en">${o.gloss||''}</div></div>`;});
  html+='</div>';D.innerHTML=html;D.scrollTop=0;
  D.querySelectorAll('.conn').forEach(c=>c.onclick=()=>{setMode('explore');go(c.dataset.go);});
}
function drawTwoDetail(a,b){$('detail').innerHTML=`<div class="dhead"><div class="he" style="font-size:20px">${byId[a].he} … ${byId[b].he}</div><div class="meta">no path found</div></div>`;}
function drawTorahDetail(ref,es,ns){
  const D=$('detail');const be=es.filter(e=>e.ty==='bechina').length,ei=es.filter(e=>e.ty==='eitza').length;
  let html=`<div class="dhead"><div class="he" style="font-size:22px">לקוטי מוהר"ן ${ref.replace(':',' · ')}</div>
    <div class="meta">${ns.size} concepts · ${ei} advice · ${be} aspect edges</div></div><div class="grp"><h3>Concepts in this teaching</h3>`;
  [...ns].map(id=>byId[id]).filter(Boolean).sort((x,y)=>y.deg-x.deg).forEach(o=>{html+=`<div class="conn" data-go="${o.id}">
    <div class="row"><span class="he">${o.he||''}</span><span class="w">deg ${o.deg}</span></div><div class="en">${o.gloss||''}</div></div>`;});
  html+='</div>';D.innerHTML=html;D.scrollTop=0;
  D.querySelectorAll('.conn').forEach(c=>c.onclick=()=>{setMode('explore');go(c.dataset.go);});
}
</script>
