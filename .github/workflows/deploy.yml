name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.227.65.229
          port: 22
          username: root
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: /opt/mapjs/deploy.sh
