<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Torah Map - Fixed</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="./css/styles.css">

    <!-- jQuery and jQuery UI -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <!-- Sigma.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/1.2.1/sigma.min.js"></script>

    <!-- Working Sigma.js plugins -->
    <script src="https://cdn.jsdelivr.net/gh/jacomyal/sigma.js@v1.2.1/plugins/sigma.plugins.dragNodes/sigma.plugins.dragNodes.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jacomyal/sigma.js@v1.2.1/plugins/sigma.layout.forceAtlas2/worker.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jacomyal/sigma.js@v1.2.1/plugins/sigma.layout.forceAtlas2/supervisor.js"></script>

    <!-- Data -->
    <script src="./data/torah2.js"></script>

    <!-- Helper Scripts -->
    <script src="./js/hello-sigma.js"></script>
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        <!-- Graph Container -->
        <div id="graph-container"></div>

        <!-- Panel Container -->
        <div class="panel-container" id="panelContainer">
            <div class="resize-handle" id="resizeHandle"></div>

            <button class="toggle-panel-btn" id="togglePanelBtn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>

            <div class="panel-tabs">
                <button class="panel-tab active" id="tab_search" onclick="switchToTab('search')">Search</button>
                <button class="panel-tab" id="tab_details" onclick="switchToTab('details')">Details</button>
            </div>

            <!-- Search Panel Content -->
            <div class="panel-content active" id="searchPanel">
    <div id="div_cypher_query" class="control-panel">
        <div class="panel-header">
            <div class="panel-title">
                <h1>Torah Map Explorer</h1>
                <p>Choose a discovery mode, refine your search, and uncover meaningful connections.</p>
            </div>
            <div class="language-toggle">
                <button type="button" id="button_hebrew" class="ghost" onclick="toHebrew()">עברית</button>
                <button type="button" id="button_english" class="ghost" onclick="toEnglish()" style="display:none">English</button>
            </div>
        </div>

        <div class="query-type">
            <label for="select_query_type">Discovery Mode</label>
            <select id="select_query_type" onchange="changeQueryType(this.value)">
                <option value="advice" selected>Get Advice</option>
                <option value="effects">Get Effects</option>
                <option value="by_torah">Search By Torah</option>
                <option value="bechinos">Get Bechinos</option>
                <option value="connected">Get All Connected Topics</option>
                <option value="bechina_connections">Bechina Connections</option>
                <option value="cause_effect_path">Cause-Effect Path</option>
            </select>
        </div>

        <div class="query-sections">
            <div id="div_select_topic_advice" class="query-section active">
                <label for="input_topic_advice">Select Topic</label>
                <input id="input_topic_advice" placeholder="Start typing to search topics">
            </div>

            <div id="div_select_topic_effects" class="query-section">
                <label for="input_topic_effects">Select Topic</label>
                <input id="input_topic_effects" placeholder="Start typing to search topics">
            </div>

            <div id="div_select_topic_bechinos" class="query-section">
                <label for="input_topic_bechinos">Select Topic</label>
                <input id="input_topic_bechinos" placeholder="Start typing to search topics">
            </div>

            <div id="div_select_topic_1" class="query-section">
                <label for="input_topic_1">Select Topic</label>
                <input id="input_topic_1" placeholder="Start typing to search topics">
            </div>

            <div id="div_select_bechina_connections" class="query-section">
                <div class="field-pair">
                    <div class="field">
                        <label for="input_bechina_start" id="label_bechina_start">Start Bechina</label>
                        <input id="input_bechina_start" placeholder="Choose the starting bechina">
                    </div>
                    <div class="field">
                        <label for="input_bechina_end" id="label_bechina_end">End Bechina</label>
                        <input id="input_bechina_end" placeholder="Choose the ending bechina">
                    </div>
                </div>
                <div class="field">
                    <label for="input_node_limit" id="label_node_limit">Maximum Bechinas (default 100)</label>
                    <input id="input_node_limit" type="number" min="10" max="500" step="10" value="100">
                </div>
            </div>

            <div id="div_select_torah" class="query-section">
                <label for="select_torah">Select Torah #</label>
                <select id="select_torah"></select>
            </div>

            <div id="div_select_cause_effect" class="query-section">
                <div class="field-pair">
                    <div class="field">
                        <label for="input_start_node" id="label_start_node">Start Node</label>
                        <input id="input_start_node" placeholder="Choose where the path begins">
                    </div>
                    <div class="field">
                        <label for="input_end_node" id="label_end_node">End Node</label>
                        <input id="input_end_node" placeholder="Choose where the path ends">
                    </div>
                </div>
            </div>
        </div>

        <div class="query-actions">
            <button type="button" class="primary" onclick="runQuery()">Run Search</button>
            <p class="hint">Tip: Use at least two characters to see smart suggestions.</p>
        </div>
    </div>
            </div>

            <!-- Details Panel Content -->
            <div class="panel-content" id="detailsPanel">
    <div id="div_connection_info" class="connection-card" style="direction:rtl;">
        <div class="connection-header">
            <h2>פרטי החיבור</h2>
            <p>Explore the relationship between the selected topics.</p>
        </div>
        <dl class="connection-details">
            <div>
                <dt>מנושא</dt>
                <dd id="txt_from_node"></dd>
            </div>
            <div>
                <dt>לנושא</dt>
                <dd id="txt_to_node"></dd>
            </div>
            <div>
                <dt>ראיה</dt>
                <dd id="txt_proof"></dd>
            </div>
            <div>
                <dt>מקור</dt>
                <dd id="txt_reference"></dd>
            </div>
        </dl>
    </div>
            </div>
        </div>
    </div>

    <!-- Status -->
    <div id="div_status" class="alpha60" style="display:none"></div>

    <script>
var init_sigma;
var allTopics = [];

// Initialize on document ready
$(document).ready(function() {
    console.log('Initializing...');

    // Check if data loaded
    if (typeof torah1 === 'undefined') {
        alert('Torah data not loaded!');
        return;
    }
    console.log('Torah data loaded:', torah1.length, 'entries');

    // Extract topics for autocomplete
    var topicSet = new Set();
    var torahSet = new Set();

    torah1.forEach(function(item) {
        if (item.node1_id) topicSet.add(item.node1_id);
        if (item.node2_id) topicSet.add(item.node2_id);
        if (item.reference) torahSet.add(item.reference);
    });

    allTopics = Array.from(topicSet).sort();
    console.log('Found', allTopics.length, 'unique topics');

    // Setup autocomplete
    $("#input_topic_advice, #input_topic_effects, #input_topic_bechinos, #input_topic_1, #input_start_node, #input_end_node, #input_bechina_start, #input_bechina_end").autocomplete({
        source: allTopics,
        minLength: 2
    });

    // Populate Torah dropdown
    var torahNums = Array.from(torahSet).sort((a,b) => a-b);
    torahNums.forEach(function(num) {
        $('#select_torah').append('<option value="' + num + '">' + num + '</option>');
    });

    // Initialize Sigma
    initSigma();

    // Ensure the correct section is visible
    changeQueryType($('#select_query_type').val());

    console.log('Ready!');
});

function initSigma() {
    try {
        // Initialize with CANVAS renderer to fix edge click issues
        init_sigma = new sigma({
            renderer: {
                container: document.getElementById('graph-container'),
                type: 'canvas'  // CRITICAL: Use canvas, not webgl
            }
        });

        // Configure settings
        init_sigma.settings({
            minNodeSize: 1,
            maxNodeSize: 10,
            minEdgeSize: 0.5,
            maxEdgeSize: 2,
            enableEdgeHovering: true,
            edgeHoverSizeRatio: 2,
            defaultNodeColor: '#6cbef4',
            defaultEdgeColor: '#999',
            labelThreshold: 4,
            labelSize: 'fixed',
            defaultLabelSize: 13,
            drawEdges: true,
            drawEdgeLabels: false,
            edgesPowRatio: 0.8,
            edgesArrowSize: 8,
            minArrowSize: 5
        });

        // Enable drag nodes
        var dragListener = sigma.plugins.dragNodes(init_sigma, init_sigma.renderers[0]);

        // Bind edge click
        init_sigma.bind('clickEdge', function(e) {
            var edge = e.data.edge;
            $('#txt_from_node').text(edge.node1_text || '');
            $('#txt_to_node').text(edge.node2_text || '');
            $('#txt_proof').text(edge.proof || '');
            $('#txt_reference').text(edge.reference || '');

            // Show connection info and switch to Details tab
            $('#div_connection_info').show();
            switchToTab('details');
        });

        // Hide info on stage click
        init_sigma.bind('clickStage', function(e) {
            // Don't hide the panel, just clear selection
            // Users can manually switch back to Search tab if needed
        });

        console.log('Sigma initialized successfully');
    } catch(e) {
        console.error('Failed to init sigma:', e);
    }
}

function changeQueryType(type) {
    var sectionMap = {
        'advice': 'div_select_topic_advice',
        'effects': 'div_select_topic_effects',
        'by_torah': 'div_select_torah',
        'bechinos': 'div_select_topic_bechinos',
        'connected': 'div_select_topic_1',
        'bechina_connections': 'div_select_bechina_connections',
        'cause_effect_path': 'div_select_cause_effect'
    };

    $('.query-section').removeClass('active');

    var targetId = sectionMap[type];
    if (targetId) {
        $('#' + targetId).addClass('active');
    }
}

function findBechinaConnections(startQuery, endQuery, torahData, options) {
    options = options || {};
    var maxDepth = options.maxDepth || 6;
    var nodeLimit = options.nodeLimit || 100;

    if (!startQuery || !endQuery) {
        return { edges: [], nodes: [], startNode: null, endNode: null };
    }

    var adjacency = {};
    var edgeLookup = {};

    torahData.forEach(function(edge) {
        if (edge.type !== 'bechina') {
            return;
        }
        if (!edge.node1_id || !edge.node2_id) {
            return;
        }

        if (!adjacency[edge.node1_id]) {
            adjacency[edge.node1_id] = new Set();
        }
        if (!adjacency[edge.node2_id]) {
            adjacency[edge.node2_id] = new Set();
        }
        adjacency[edge.node1_id].add(edge.node2_id);
        adjacency[edge.node2_id].add(edge.node1_id);

        var keyParts = [edge.node1_id, edge.node2_id].sort();
        var key = keyParts[0] + '||' + keyParts[1];
        if (!edgeLookup[key]) {
            edgeLookup[key] = [];
        }
        edgeLookup[key].push(edge);
    });

    var allNodes = Object.keys(adjacency);

    function matchNode(query) {
        if (!query) return null;
        var exact = allNodes.find(function(node) { return node === query; });
        if (exact) return exact;
        var lower = query.toLowerCase();
        var exactInsensitive = allNodes.find(function(node) { return node.toLowerCase() === lower; });
        if (exactInsensitive) return exactInsensitive;
        var partial = allNodes.find(function(node) { return node.toLowerCase().includes(lower); });
        return partial || null;
    }

    var startNode = matchNode(startQuery);
    var endNode = matchNode(endQuery);

    if (!startNode || !endNode || startNode === endNode) {
        return { edges: [], nodes: [], startNode: startNode, endNode: endNode };
    }

    function bfsDistances(source) {
        var distances = {};
        if (!source) {
            return distances;
        }
        var queue = [source];
        distances[source] = 0;

        while (queue.length > 0) {
            var current = queue.shift();
            var depth = distances[current];
            if (depth >= maxDepth) {
                continue;
            }
            var neighbors = adjacency[current] ? Array.from(adjacency[current]) : [];
            neighbors.forEach(function(neighbor) {
                if (distances.hasOwnProperty(neighbor)) {
                    return;
                }
                distances[neighbor] = depth + 1;
                queue.push(neighbor);
            });
        }

        return distances;
    }

    var distFromStart = bfsDistances(startNode);
    var distFromEnd = bfsDistances(endNode);

    if (!distFromStart.hasOwnProperty(endNode)) {
        return { edges: [], nodes: [], startNode: startNode, endNode: endNode };
    }

    var candidateNodes = [];
    Object.keys(distFromStart).forEach(function(node) {
        if (distFromEnd.hasOwnProperty(node) && (distFromStart[node] + distFromEnd[node] <= maxDepth)) {
            candidateNodes.push(node);
        }
    });

    candidateNodes.push(startNode, endNode);
    candidateNodes = Array.from(new Set(candidateNodes));

    function nodeScore(node) {
        if (node === startNode || node === endNode) {
            return -1;
        }
        var startScore = distFromStart.hasOwnProperty(node) ? distFromStart[node] : maxDepth + 1;
        var endScore = distFromEnd.hasOwnProperty(node) ? distFromEnd[node] : maxDepth + 1;
        return startScore + endScore;
    }

    candidateNodes.sort(function(a, b) {
        return nodeScore(a) - nodeScore(b);
    });

    var allowedNodes = new Set(candidateNodes.slice(0, Math.max(nodeLimit, 10)));
    allowedNodes.add(startNode);
    allowedNodes.add(endNode);

    if (allowedNodes.size > nodeLimit) {
        var removable = Array.from(allowedNodes).filter(function(node) {
            return node !== startNode && node !== endNode;
        });
        removable.sort(function(a, b) {
            return nodeScore(b) - nodeScore(a);
        });
        while (allowedNodes.size > nodeLimit && removable.length > 0) {
            var toRemove = removable.shift();
            allowedNodes.delete(toRemove);
        }
    }

    var results = [];
    var seenEdgeIds = new Set();

    Object.keys(edgeLookup).forEach(function(key) {
        var parts = key.split('||');
        var nodeA = parts[0];
        var nodeB = parts[1];

        if (!allowedNodes.has(nodeA) || !allowedNodes.has(nodeB)) {
            return;
        }

        var validForPath = false;
        if (distFromStart.hasOwnProperty(nodeA) && distFromEnd.hasOwnProperty(nodeB) &&
            (distFromStart[nodeA] + 1 + distFromEnd[nodeB] <= maxDepth)) {
            validForPath = true;
        }
        if (!validForPath && distFromStart.hasOwnProperty(nodeB) && distFromEnd.hasOwnProperty(nodeA) &&
            (distFromStart[nodeB] + 1 + distFromEnd[nodeA] <= maxDepth)) {
            validForPath = true;
        }

        if (!validForPath) {
            return;
        }

        edgeLookup[key].forEach(function(edge) {
            if (!edge || seenEdgeIds.has(edge.id)) {
                return;
            }
            seenEdgeIds.add(edge.id);
            results.push(edge);
        });
    });

    return {
        edges: results,
        nodes: Array.from(allowedNodes),
        startNode: startNode,
        endNode: endNode
    };
}

function findCauseEffectPaths(startNodeSearch, endNodeSearch, torah1Data) {
    // Build adjacency list for efficient traversal
    var adjList = {};
    var edgeMap = {}; // Map to store actual edge data for reconstruction

    // Initialize adjacency list
    torah1Data.forEach(function(edge) {
        if (!adjList[edge.node1_id]) {
            adjList[edge.node1_id] = { bechina: [], child_eitza: [] };
        }
        if (!adjList[edge.node2_id]) {
            adjList[edge.node2_id] = { bechina: [], child_eitza: [] };
        }

        // Store edge data for later retrieval
        var edgeKey = edge.node1_id + '||' + edge.node2_id + '||' + edge.type;
        edgeMap[edgeKey] = edge;

        if (edge.type === 'bechina') {
            adjList[edge.node1_id].bechina.push(edge.node2_id);
            adjList[edge.node2_id].bechina.push(edge.node1_id);
            // Store reverse edge too
            edgeMap[edge.node2_id + '||' + edge.node1_id + '||bechina'] = edge;
        } else if (edge.type === 'eitza') {
            adjList[edge.node1_id].child_eitza.push(edge.node2_id);
        }
    });

    // Find actual node IDs using partial matching
    var startNodes = Object.keys(adjList).filter(function(nodeId) {
        return nodeId.includes(startNodeSearch);
    });
    var endNodes = Object.keys(adjList).filter(function(nodeId) {
        return nodeId.includes(endNodeSearch);
    });

    if (startNodes.length === 0 || endNodes.length === 0) {
        return { edges: [], startNode: null, endNode: null };
    }

    console.log('Found', startNodes.length, 'start nodes and', endNodes.length, 'end nodes');

    var allPaths = [];
    var allStartNodes = [];
    var allEndNodes = new Set(endNodes);

    // Phase 1: BFS from ALL matching start nodes up to 5 bechina edges to find potential cause nodes
    var queue = [];
    var globalVisited = new Map(); // node -> min depth seen
    var causeNodes = [];

    // Initialize queue with all matching start nodes
    startNodes.forEach(function(startNode) {
        queue.push({node: startNode, path: [startNode], depth: 0, visited: new Set([startNode]), startNode: startNode});
        allStartNodes.push(startNode);
    });

    while (queue.length > 0) {
        var current = queue.shift();

        // Create a unique key with start node to allow different paths from different starts
        var visitKey = current.startNode + '::' + current.node + '::' + current.depth;
        if (globalVisited.has(visitKey)) {
            continue;
        }
        globalVisited.set(visitKey, true);

        // This node could be a cause if it has eitza connections
        if (adjList[current.node].child_eitza.length > 0) {
            causeNodes.push({
                node: current.node,
                pathFromStart: current.path,
                visitedNodes: current.visited,
                originalStart: current.startNode
            });
        }

        // Continue exploring if depth < 5
        if (current.depth < 5 && adjList[current.node].bechina) {
            adjList[current.node].bechina.forEach(function(neighbor) {
                if (!current.visited.has(neighbor)) {
                    var newVisited = new Set(current.visited);
                    newVisited.add(neighbor);
                    queue.push({
                        node: neighbor,
                        path: current.path.concat([neighbor]),
                        depth: current.depth + 1,
                        visited: newVisited,
                        startNode: current.startNode
                    });
                }
            });
        }
    }

    // Early exit if no cause nodes found
    if (causeNodes.length === 0) {
        console.log('No cause nodes found');
        return { edges: [], startNode: null, endNode: null };
    }

    // Phase 2: For each cause node, follow eitza edge to effect, then BFS to endNode
    // Limit cause nodes if there are too many to prevent explosion
    var maxCauseNodes = 100;
    if (causeNodes.length > maxCauseNodes) {
        console.log('Too many cause nodes (' + causeNodes.length + '), limiting to ' + maxCauseNodes);
        causeNodes = causeNodes.slice(0, maxCauseNodes);
    }

    causeNodes.forEach(function(causeInfo) {
        // Early exit if we already found 20 paths
        if (allPaths.length >= 20) return;

        var causeNode = causeInfo.node;

        // Get all effect nodes from this cause
        adjList[causeNode].child_eitza.forEach(function(effectNode) {
            // Skip if effect node was already visited in the path from start
            if (causeInfo.visitedNodes.has(effectNode)) return;

            // Phase 3: BFS from effect node up to 5 bechina edges to find endNode
            var queue2 = [{node: effectNode, path: [effectNode], depth: 0, visited: new Set([effectNode])}];
            var globalVisited2 = new Map();

            while (queue2.length > 0) {
                var current2 = queue2.shift();

                // Prune if we've seen this node at a lower depth
                if (globalVisited2.has(current2.node) && globalVisited2.get(current2.node) < current2.depth) {
                    continue;
                }
                globalVisited2.set(current2.node, current2.depth);

                // Check if we reached ANY of the matching end nodes
                if (allEndNodes.has(current2.node)) {
                    var fullPath = causeInfo.pathFromStart.concat([effectNode]).concat(current2.path.slice(1));
                    allPaths.push({
                        path: fullPath,
                        causeNode: causeNode,
                        effectNode: effectNode,
                        startNode: causeInfo.originalStart,
                        endNode: current2.node,
                        length: fullPath.length - 1
                    });
                    // Continue exploring to find other end nodes, don't break
                    continue;
                }

                // Continue exploring if depth < 5
                if (current2.depth < 5 && adjList[current2.node].bechina) {
                    adjList[current2.node].bechina.forEach(function(neighbor) {
                        // Use Set for O(1) lookups instead of .includes()
                        if (!current2.visited.has(neighbor) && !causeInfo.visitedNodes.has(neighbor)) {
                            var newVisited2 = new Set(current2.visited);
                            newVisited2.add(neighbor);
                            queue2.push({
                                node: neighbor,
                                path: current2.path.concat([neighbor]),
                                depth: current2.depth + 1,
                                visited: newVisited2
                            });
                        }
                    });
                }
            }
        });
    });

    // Sort by length and take top 20
    allPaths.sort(function(a, b) { return a.length - b.length; });
    allPaths = allPaths.slice(0, 20);

    // Convert paths to edges for visualization
    var resultEdges = [];
    var edgeSet = new Set();

    allPaths.forEach(function(pathInfo) {
        var path = pathInfo.path;
        for (var i = 0; i < path.length - 1; i++) {
            var from = path[i];
            var to = path[i + 1];

            // Determine edge type
            var edgeType = (from === pathInfo.causeNode && to === pathInfo.effectNode) ? 'eitza' : 'bechina';

            // Try both directions for the edge
            var edgeKey1 = from + '||' + to + '||' + edgeType;
            var edgeKey2 = to + '||' + from + '||' + edgeType;

            var edge = edgeMap[edgeKey1] || edgeMap[edgeKey2];
            if (edge) {
                var edgeId = edge.node1_id + '-' + edge.node2_id + '-' + edge.type;
                if (!edgeSet.has(edgeId)) {
                    edgeSet.add(edgeId);
                    resultEdges.push(edge);
                }
            }
        }
    });

    console.log('Found', allPaths.length, 'cause-effect paths');

    // Collect all unique start and end nodes from found paths
    var actualStartNodes = new Set();
    var actualEndNodes = new Set();
    allPaths.forEach(function(pathInfo) {
        actualStartNodes.add(pathInfo.startNode);
        actualEndNodes.add(pathInfo.endNode);
    });

    return {
        edges: resultEdges,
        startNodes: Array.from(actualStartNodes),
        endNodes: Array.from(actualEndNodes)
    };
}

function runQuery() {
    if (!init_sigma) {
        alert('Graph not initialized');
        return;
    }

    showStatus('Searching...');

    // Stop any running layout from previous search
    if (init_sigma.isForceAtlas2Running && init_sigma.isForceAtlas2Running()) {
        init_sigma.stopForceAtlas2();
    }

    // Kill the ForceAtlas2 worker to fully reset it
    if (init_sigma.killForceAtlas2) {
        init_sigma.killForceAtlas2();
    }

    // Clear the graph completely
    init_sigma.graph.clear();
    init_sigma.refresh();

    // Reset camera to default position
    init_sigma.camera.goTo({
        x: 0,
        y: 0,
        angle: 0,
        ratio: 1
    });

    var queryType = $('#select_query_type').val();
    var results = [];

    switch(queryType) {
        case 'advice':
            var topic = $('#input_topic_advice').val();
            if (!topic) {
                showStatus('Please enter a topic');
                return;
            }
            results = torah1.filter(item =>
                item.type === 'eitza' && item.node2_id && item.node2_id.includes(topic)
            );
            break;

        case 'effects':
            var topic = $('#input_topic_effects').val();
            if (!topic) {
                showStatus('Please enter a topic');
                return;
            }
            results = torah1.filter(item =>
                item.type === 'eitza' && item.node1_id && item.node1_id.includes(topic)
            );
            break;

        case 'by_torah':
            var torahNum = parseInt($('#select_torah').val());
            results = torah1.filter(item => item.reference === torahNum);
            break;

        case 'bechinos':
            var topic = $('#input_topic_bechinos').val();
            if (!topic) {
                showStatus('Please enter a topic');
                return;
            }
            results = torah1.filter(item =>
                item.type === 'bechina' &&
                ((item.node1_id && item.node1_id.includes(topic)) ||
                 (item.node2_id && item.node2_id.includes(topic)))
            );
            break;

        case 'connected':
            var topic = $('#input_topic_1').val();
            if (!topic) {
                showStatus('Please enter a topic');
                return;
            }
            results = torah1.filter(item =>
                (item.node1_id && item.node1_id.includes(topic)) ||
                (item.node2_id && item.node2_id.includes(topic))
            );
            break;

        case 'bechina_connections':
            var startBechina = $('#input_bechina_start').val();
            var endBechina = $('#input_bechina_end').val();
            var nodeLimit = parseInt($('#input_node_limit').val(), 10);
            if (isNaN(nodeLimit) || nodeLimit <= 0) {
                nodeLimit = 100;
            }
            nodeLimit = Math.min(Math.max(nodeLimit, 10), 500);

            if (!startBechina || !endBechina) {
                showStatus('Please enter both bechinas');
                return;
            }

            var bechinaResult = findBechinaConnections(startBechina, endBechina, torah1, {
                maxDepth: 6,
                nodeLimit: nodeLimit
            });

            if (!bechinaResult) {
                showStatus('No bechina path found within the selected depth');
                setTimeout(() => $('#div_status').hide(), 3000);
                return;
            }

            if (!bechinaResult.startNode || !bechinaResult.endNode) {
                showStatus('Could not find matching bechinas in the data');
                setTimeout(() => $('#div_status').hide(), 3000);
                return;
            }

            if (bechinaResult.startNode === bechinaResult.endNode) {
                showStatus('Please choose two different bechinas');
                setTimeout(() => $('#div_status').hide(), 3000);
                return;
            }

            if (bechinaResult.edges.length === 0) {
                showStatus('No bechina path found within the selected depth');
                setTimeout(() => $('#div_status').hide(), 3000);
                return;
            }

            buildGraph(bechinaResult.edges, {
                startNodes: [bechinaResult.startNode],
                endNodes: [bechinaResult.endNode],
                startColor: '#f5963e',
                endColor: '#4acfc8',
                statusMessage: 'Found ' + bechinaResult.nodes.length + ' bechinas and ' + bechinaResult.edges.length + ' connections'
            });
            return;

        case 'cause_effect_path':
            var startNode = $('#input_start_node').val();
            var endNode = $('#input_end_node').val();
            if (!startNode || !endNode) {
                showStatus('Please enter both start and end nodes');
                return;
            }
            var pathResult = findCauseEffectPaths(startNode, endNode, torah1);
            if (!pathResult || pathResult.edges.length === 0) {
                showStatus('No cause-effect path found between these nodes');
                setTimeout(() => $('#div_status').hide(), 3000);
                return;
            }
            // Build graph with highlighted nodes (now arrays)
            buildGraph(pathResult.edges, {
                startNodes: pathResult.startNodes,
                endNodes: pathResult.endNodes
            });
            return; // Skip the normal buildGraph call below
    }

    console.log('Query returned', results.length, 'results');

    if (results.length === 0) {
        showStatus('No results found');
        setTimeout(() => $('#div_status').hide(), 2000);
        return;
    }

    // Build graph
    buildGraph(results.slice(0, 150));
}

function buildGraph(edges, highlightNodes) {
    var nodes = {};
    var degrees = {};
    highlightNodes = highlightNodes || {};

    // Build nodes from edges
    edges.forEach(function(edge, idx) {
        if (edge.node1_id && !nodes[edge.node1_id]) {
            nodes[edge.node1_id] = {
                id: edge.node1_id,
                label: edge.node1_text || edge.node1_id,
                x: 0,
                y: 0,
                size: 1,
                color: '#6cbef4'
            };
        }

        if (edge.node2_id && !nodes[edge.node2_id]) {
            nodes[edge.node2_id] = {
                id: edge.node2_id,
                label: edge.node2_text || edge.node2_id,
                x: 0,
                y: 0,
                size: 1,
                color: '#6cbef4'
            };
        }
    });

    // Place nodes on a circle so the layout starts evenly spaced
    var nodeIds = Object.keys(nodes);
    nodeIds.forEach(function(id, index) {
        var angle = (2 * Math.PI * index) / nodeIds.length;
        nodes[id].x = Math.cos(angle);
        nodes[id].y = Math.sin(angle);
    });

    // Add nodes to graph
    Object.values(nodes).forEach(node => {
        init_sigma.graph.addNode(node);
    });

    // Add edges with all properties
    edges.forEach(function(edge, idx) {
        if (edge.node1_id && edge.node2_id) {
            try {
                init_sigma.graph.addEdge({
                    id: 'e' + idx,
                    source: edge.node1_id,
                    target: edge.node2_id,
                    type: edge.type === 'eitza' ? 'arrow' : 'line',
                    // Store all data for click handler
                    node1_text: edge.node1_text,
                    node2_text: edge.node2_text,
                    proof: edge.proof,
                    reference: edge.reference,
                    color: edge.type === 'eitza' ? '#cf4ac8' : '#999',
                    size: 1
                });
                degrees[edge.node1_id] = (degrees[edge.node1_id] || 0) + 1;
                degrees[edge.node2_id] = (degrees[edge.node2_id] || 0) + 1;
            } catch(e) {
                // Skip duplicate edges
            }
        }
    });

    // Scale node sizes based on degree for better visibility
    Object.keys(degrees).forEach(function(id) {
        var node = init_sigma.graph.nodes(id);
        if (node) {
            node.size = 1 + Math.sqrt(degrees[id]);
        }
    });

    // Apply special highlighting to start/end nodes (after degree scaling)
    var startColor = highlightNodes.startColor || '#00ff00';
    var endColor = highlightNodes.endColor || '#ff0000';

    if (highlightNodes.startNodes) {
        highlightNodes.startNodes.forEach(function(nodeId) {
            var startNode = init_sigma.graph.nodes(nodeId);
            if (startNode) {
                startNode.color = startColor;
                startNode.size = Math.max(startNode.size, 10);  // Ensure it's large
            }
        });
    }
    if (highlightNodes.endNodes) {
        highlightNodes.endNodes.forEach(function(nodeId) {
            var endNode = init_sigma.graph.nodes(nodeId);
            if (endNode) {
                endNode.color = endColor;
                endNode.size = Math.max(endNode.size, 10);  // Ensure it's large
            }
        });
    }

    // Refresh display
    init_sigma.refresh();

    // Apply force layout if available
    if (init_sigma.startForceAtlas2) {
        var useBarnesHut = init_sigma.graph.nodes().length > 50;
        init_sigma.startForceAtlas2({
            worker: true,
            barnesHutOptimize: useBarnesHut,
            barnesHutTheta: 0.8,
            gravity: 0.6,
            scalingRatio: 18,
            slowDown: 4,
            strongGravityMode: true
        });

        setTimeout(function() {
            init_sigma.stopForceAtlas2();
            fitToScreen();
        }, Math.min(5000, 1000 + edges.length * 15));
    } else {
        fitToScreen();
    }

    if (highlightNodes.statusMessage) {
        showStatus(highlightNodes.statusMessage);
    } else {
        showStatus('Found ' + Object.keys(nodes).length + ' nodes, ' + edges.length + ' connections');
    }
    setTimeout(() => $('#div_status').hide(), 3000);
}

function fitToScreen() {
    if (!init_sigma) return;
    var graphNodes = init_sigma.graph.nodes();
    if (!graphNodes.length) return;

    var bounds = graphNodes.reduce(function(acc, node) {
        acc.minX = Math.min(acc.minX, node.x);
        acc.maxX = Math.max(acc.maxX, node.x);
        acc.minY = Math.min(acc.minY, node.y);
        acc.maxY = Math.max(acc.maxY, node.y);
        return acc;
    }, { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });

    var renderer = init_sigma.renderers[0];
    var width = renderer.width || renderer.container.offsetWidth;
    var height = renderer.height || renderer.container.offsetHeight;

    if (!width || !height) return;

    var sizeX = bounds.maxX - bounds.minX;
    var sizeY = bounds.maxY - bounds.minY;

    // Use proportional padding (20% of viewport on each side = 40% total)
    var paddingX = width * 0.4;
    var paddingY = height * 0.4;

    var ratioX = sizeX ? (sizeX + paddingX) / width : 1;
    var ratioY = sizeY ? (sizeY + paddingY) / height : 1;
    var ratio = Math.max(ratioX, ratioY);

    var target = {
        x: (bounds.minX + bounds.maxX) / 2,
        y: (bounds.minY + bounds.maxY) / 2,
        ratio: ratio || 1
    };

    if (sigma.misc && sigma.misc.animation && typeof sigma.misc.animation.camera === 'function') {
        sigma.misc.animation.camera(init_sigma.camera, target, { duration: 300 });
    } else {
        init_sigma.camera.goTo(target);
    }
    init_sigma.refresh();
}

function showStatus(msg) {
    $('#div_status').text(msg).show();
    var elem = document.getElementById('div_status');
    if (elem) {
        elem.style.top = 'calc(50% - ' + (elem.offsetHeight/2) + 'px)';
        elem.style.left = 'calc(50% - ' + (elem.offsetWidth/2) + 'px)';
    }
}

// Tab switching
function switchToTab(tabName) {
    // Update tab buttons
    $('.panel-tab').removeClass('active');

    if (tabName === 'search') {
        $('#tab_search').addClass('active');
        $('#searchPanel').addClass('active');
        $('#detailsPanel').removeClass('active');
    } else if (tabName === 'details') {
        $('#tab_details').addClass('active');
        $('#detailsPanel').addClass('active');
        $('#searchPanel').removeClass('active');
    }
}

// Toggle panel collapse/expand
$(document).ready(function() {
    $('#togglePanelBtn').click(function() {
        $('#panelContainer').toggleClass('collapsed');
    });

    // Resize functionality
    var isResizing = false;
    var resizeHandle = $('#resizeHandle');
    var panelContainer = $('#panelContainer');

    resizeHandle.on('mousedown', function(e) {
        isResizing = true;
        resizeHandle.addClass('dragging');
        $('body').css({
            'cursor': 'ew-resize',
            'user-select': 'none'
        });
        e.preventDefault();
    });

    $(document).on('mousemove', function(e) {
        if (!isResizing) return;

        var containerRect = $('.main-container')[0].getBoundingClientRect();
        var newWidth = e.clientX - containerRect.left;

        if (newWidth >= 300 && newWidth <= 600) {
            panelContainer.css('width', newWidth + 'px');
            $('#togglePanelBtn').css('left', newWidth + 'px');
        }
    });

    $(document).on('mouseup', function() {
        if (isResizing) {
            isResizing = false;
            resizeHandle.removeClass('dragging');
            $('body').css({
                'cursor': '',
                'user-select': ''
            });
        }
    });
});
