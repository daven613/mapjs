<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merge Review — Phase 1 Canonicalization</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#1c1917; --mut:#78716c; --line:#e7e2d9;
          --ok:#15803d; --no:#b91c1c; --un:#a16207; --acc:#1d4ed8; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 22px; display:flex; gap:18px; align-items:center; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .tab { padding:6px 14px; border-radius:20px; border:1px solid var(--line); cursor:pointer; background:none; font-size:14px; }
  .tab.active { background:var(--acc); color:#fff; border-color:var(--acc); }
  #savestat { margin-left:auto; font-size:13px; color:var(--mut); }
  main { max-width:980px; margin:20px auto 120px; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:16px 0; padding:18px 20px; }
  .heb { direction:rtl; text-align:right; font-size:1.25em; font-family:'SBL Hebrew','Ezra SIL','Taamey Frank CLM',serif; }
  .concept-title { font-size:24px; font-weight:700; }
  .gloss { font-size:15px; color:var(--ink); background:#eef4ff; border-inline-start:4px solid var(--acc);
           padding:8px 12px; border-radius:6px; margin:8px 0; }
  .flags span { display:inline-block; background:#fef3c7; color:#92400e; border-radius:12px;
                padding:1px 10px; font-size:12px; margin-inline-end:6px; }
  .adjnote { font-size:13px; color:var(--mut); font-style:italic; margin:6px 0; }
  .rec { font-size:14px; background:#f0fdf4; border-inline-start:4px solid var(--ok);
         padding:8px 12px; border-radius:6px; margin:8px 0; }
  .ruling { font-size:14px; background:#fff7ed; border-inline-start:4px solid var(--un);
            padding:8px 12px; border-radius:6px; margin:8px 0; }
  .member { border-top:1px dashed var(--line); margin-top:12px; padding-top:12px; }
  .mrow { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .form { font-weight:600; }
  .tier { font-size:12px; border-radius:10px; padding:1px 9px; }
  .tier.obvious { background:#dcfce7; color:var(--ok); }
  .tier.likely { background:#fef9c3; color:var(--un); }
  .tier.question { background:#fee2e2; color:var(--no); }
  .btns { margin-inline-start:auto; display:flex; gap:6px; }
  .btns button { border:1px solid var(--line); background:#fafaf9; border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; }
  .btns button.sel-approve { background:var(--ok); color:#fff; border-color:var(--ok); }
  .btns button.sel-reject { background:var(--no); color:#fff; border-color:var(--no); }
  .btns button.sel-unsure { background:var(--un); color:#fff; border-color:var(--un); }
  .mnote { font-size:13px; color:var(--mut); margin:4px 0; }
  details { margin:8px 0 0; }
  summary { cursor:pointer; color:var(--acc); font-size:13px; }
  .ctx { border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:8px 0; background:#fdfcfa; }
  .ctxhead { font-size:12px; color:var(--mut); margin-bottom:6px; }
  .ctxhead b { color:var(--ink); }
  .proof { background:#fffbeb; border-radius:6px; padding:6px 10px; margin:6px 0; }
  .para { max-height:340px; overflow-y:auto; border-top:1px dotted var(--line); margin-top:8px; padding-top:8px; }
  .para .he { direction:rtl; text-align:right; font-size:1.15em; font-family:serif; }
  .para .he.hit { background:#fde68a; border-radius:4px; }
  .para .en { color:var(--mut); font-size:0.92em; margin-bottom:7px; }
  .keytag { font-size:11px; color:var(--mut); }
  .qline { font-size:14px; color:var(--mut); margin:4px 0 8px; }
  .cgroup { border:1px solid var(--line); border-radius:10px; margin:12px 0; padding:6px 14px 12px; background:#fbfaf7; }
  .cghead { margin:8px 0 2px; }
  .cgname { font-size:19px; font-weight:700; margin-inline-start:8px; }
  .cgg { display:block; font-size:13.5px; color:var(--ink); background:#eef4ff; border-radius:6px; padding:5px 10px; margin:6px 0; }
  .cgflag { display:inline-block; background:#fef3c7; color:#92400e; border-radius:12px; padding:0 9px; font-size:11.5px; }
  .loadp { border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 10px; font-size:12.5px; cursor:pointer; color:var(--acc); }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
           padding:10px 22px; display:flex; gap:14px; align-items:center; }
  footer button { padding:8px 16px; border-radius:8px; border:1px solid var(--line); cursor:pointer; background:#fafaf9; }
  #progress { font-size:13px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Merge Review</h1>
  <button class="tab active" data-s="1">Questions</button>
  <button class="tab" data-s="2">Likely</button>
  <button class="tab" data-s="3">Typography</button>
  <span id="savestat">…</span>
</header>
<main id="main"></main>
<footer>
  <span id="progress"></span>
  <button onclick="download()">Download decisions.json (backup)</button>
</footer>
<script>
const CARDS = /*__DATA__*/;
let decisions = {};          // key: cardId + '::' + form  ->  approve|reject|unsure
let currentSection = 1;

const NIQQUD = /[֑-ׇ]/g;
const NONHEB = /[^א-ת]/g;
const lonly = s => (s||'').replace(NIQQUD,'').replace(NONHEB,'');
const isHeb = s => (s.match(/[א-ת]/g)||[]).length >= (s.trim().length*0.3||1);

function defaultFor(card, m, idx){
  if (m.recommend==='approve'||m.recommend==='reject') return m.recommend;
  if (idx===0) return 'approve';
  if (m.tier==='obvious') return 'approve';
  if (m.tier==='likely') return 'approve';
  return 'unsure';
}

function key(card,m){ return card.id+'::'+m.form; }

function render(){
  const main=document.getElementById('main'); main.innerHTML='';
  for (const card of CARDS.filter(c=>c.section===currentSection)){
    const el=document.createElement('div'); el.className='card';
    const nCon=card.concepts.length, nMem=card.concepts.reduce((a,c)=>a+c.members.length,0);
    el.innerHTML = `
      <div class="concept-title heb">${esc(card.title_he)}</div>
      <div class="qline">THE QUESTION: ${nMem} similar form${nMem>1?'s':''}, grouped into
        <b>${nCon} concept box${nCon>1?'es':''}</b> below. Forms in the SAME box = one concept;
        different boxes = kept separate. ✓ = this form is in the right box.</div>
      <div class="flags">${card.flags.map(f=>`<span>${esc(f)}</span>`).join('')}</div>
      ${card.rec?`<div class="rec"><b>Recommendation</b> (${esc(card.rec.verdict)}, ${esc(card.rec.confidence)} confidence): ${esc(card.rec.reason)}</div>`:''}
      ${card.ruling?`<div class="ruling"><b>Your ruling:</b> ${esc(card.ruling.ruling)}
        ${card.ruling.verifier_disagreement?`<br><b>⚠ Verifier disagrees:</b> ${esc(card.ruling.verifier_disagreement)}`:''}</div>`:''}
      ${card.notes?`<div class="adjnote">adjudicator: ${esc(card.notes)}</div>`:''}`;
    let gi=0;
    for (const con of card.concepts){
      const g=document.createElement('div'); g.className='cgroup';
      g.innerHTML=`<div class="cghead"><span class="heb cgname">${esc(con.canonical_he)}</span>
        <span class="cgg">${esc(con.gloss)}</span>
        ${con.flags.map(f=>`<span class="cgflag">${esc(f)}</span>`).join('')}</div>`;
      renderMembers(card, con, g);
      el.appendChild(g); gi++;
    }
    main.appendChild(el);
  }
  attachHandlers();
  paint();
}

function renderMembers(card, con, el){
    con.members.forEach((m,idx)=>{
      const k=key(card,m);
      if(!(k in decisions)) decisions[k]=defaultFor(card,m,idx);
      const d=document.createElement('div'); d.className='member';
      d.innerHTML=`
        <div class="mrow">
          <span class="form heb">${esc(m.form)}</span>
          <span class="tier ${m.tier}">${m.tier}</span>
          <span class="btns" data-k="${escAttr(k)}">
            <button data-v="approve">✓ right box</button>
            <button data-v="reject">✗ wrong box</button>
            <button data-v="unsure">? unsure</button>
          </span>
        </div>
        ${m.note?`<div class="mnote">${esc(m.note)}</div>`:''}
        <details><summary>context — ALL ${m.contexts.length} usage${m.contexts.length===1?'':'s'}</summary>
          ${m.contexts.map(ctx=>`
            <div class="ctx">
              <div class="ctxhead"><b>${esc(ctx.where)}</b> · relation: <b>${esc(ctx.type)}</b>
                · connected to: <span class="heb" style="font-size:1.1em">${esc(ctx.partner||'')}</span></div>
              <div class="proof heb">${esc(ctx.proof)}</div>
              ${(ctx.keys||[]).map(k=>`<button class="loadp" data-book="${esc(ctx.book)}" data-key="${esc(k)}" data-form="${escAttr(m.form)}">show full paragraph ${esc(k)}</button>`).join(' ')}
            </div>`).join('')}
        </details>`;
      el.appendChild(d);
    });
}

function attachHandlers(){
  document.querySelectorAll('.btns').forEach(b=>{
    b.addEventListener('click',ev=>{
      const v=ev.target.dataset.v; if(!v) return;
      decisions[b.dataset.k]=v; paint(); save();
    });
  });
  document.querySelectorAll('.loadp').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(b.dataset.done) return;
      b.textContent='loading…';
      try{
        const r=await fetch(`/chunk?book=${b.dataset.book}&key=${b.dataset.key}`);
        const j=await r.json();
        const d=document.createElement('div'); d.className='para';
        d.innerHTML=`<div class="keytag">chunk ${esc(b.dataset.key)}</div>`+paraHtml(j.text,b.dataset.form);
        b.after(d); b.dataset.done='1'; b.textContent='¶ '+b.dataset.key;
      }catch(e){ b.textContent='load failed'; }
    });
  });
}

function paraHtml(text, form){
  const target=lonly(form);
  return text.split('\n').map(line=>{
    if(!line.trim()) return '';
    if(isHeb(line)){
      const hit = target && lonly(line).includes(target) ? ' hit':'';
      return `<div class="he${hit}">${esc(line)}</div>`;
    }
    return `<div class="en">${esc(line)}</div>`;
  }).join('');
}

function paint(){
  document.querySelectorAll('.btns').forEach(b=>{
    const v=decisions[b.dataset.k];
    b.querySelectorAll('button').forEach(x=>{
      x.className = (x.dataset.v===v) ? 'sel-'+v : '';
    });
  });
  const all=Object.values(decisions);
  document.getElementById('progress').textContent =
    `${all.filter(v=>v!=='unsure').length}/${all.length} decided · ${all.filter(v=>v==='unsure').length} unsure`;
}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    localStorage.setItem('merge_decisions', JSON.stringify(decisions));
    try{
      const r=await fetch('/save',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify(decisions)});
      document.getElementById('savestat').textContent = r.ok? 'saved ✓' : 'save failed — use Download';
    }catch(e){ document.getElementById('savestat').textContent='no server — use Download'; }
  },400);
}
function download(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(decisions,null,1)],{type:'application/json'}));
  a.download='decisions.json'; a.click();
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escAttr=s=>esc(s).replace(/'/g,'&#39;');

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); currentSection=+t.dataset.s; render();
}));

(async function init(){
  try{
    const r=await fetch('/decisions');
    if(r.ok){ const j=await r.json(); if(j && Object.keys(j).length) decisions=j; }
  }catch(e){
    const ls=localStorage.getItem('merge_decisions');
    if(ls) decisions=JSON.parse(ls);
  }
  for (const card of CARDS)
    for (const con of card.concepts)
      con.members.forEach((m,idx)=>{ const k=key(card,m); if(!(k in decisions)) decisions[k]=defaultFor(card,m,idx); });
  render();
  document.getElementById('savestat').textContent='ready';
})();
</script>
</body>
</html>
